# GraphHopper 11 configuration for Scenic Route.
# Production: datareader.file points at a Geofabrik extract (centro-latest.osm.pbf for
# Tuscany, italy-latest.osm.pbf later). Run:
#   java -Xmx8g -Ddw.graphhopper.datareader.file=/data/centro-latest.osm.pbf \
#        -jar graphhopper-web-11.0.jar server config.yml
graphhopper:
  datareader.file: /data/region.osm.pbf
  graph.location: /data/graph-cache

  # Values the API asks for as path details, and the scenic custom models use.
  graph.encoded_values: car_access, car_average_speed, road_class, road_class_link, road_environment, road_access, surface, track_type, toll, country, max_speed, urban_density

  # Base model has distance_influence 0: with LM, requests may only raise it, and the API
  # sets it per request (70 for "fastest", 10–40 for the scenic strengths).
  custom_models.directory: /config/custom_models
  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [scenic_base.json]

  # LM (not CH) so per-request custom models (scenic strength, ZTL areas, unpaved) stay fast.
  profiles_ch: []
  profiles_lm:
    - profile: car
  prepare.lm.landmarks: 16
  prepare.min_network_size: 200

  routing.max_visited_nodes: 3000000
  routing.non_ch.max_waypoint_distance: 1000000
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps,bridleway,construction,proposed,platform
  graph.dataaccess.default_type: RAM_STORE
  graph.urban_density.threads: 4
  graph.urban_density.city_radius: 1500

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost
