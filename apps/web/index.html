<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set light or dark before first paint (src/appearance.ts keeps it in sync after that).
      try { var a = localStorage.getItem('panoramica.appearance'); document.documentElement.dataset.theme = a === 'light' || a === 'dark' ? a : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
    </script>
    <title>Panoramica · Journey planner</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <aside id="panel" aria-label="Journey planner"></aside>
      <main id="map" aria-label="Map"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
