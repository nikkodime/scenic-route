name: ScenicRoute
options:
  bundleIdPrefix: app.scenicroute
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ScenicKit:
    path: ScenicKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "59U9VSKF6K"
    CODE_SIGN_STYLE: Automatic
targets:
  ScenicRoute:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ScenicKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Panoramica
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Panoramica uses your location as the start of your drive.
        LSApplicationQueriesSchemes: [comgooglemaps]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Device test builds reach the API on the Mac over the home Wi-Fi (SCENIC_API_BASE_URL=http://<mac-ip>:8795).
        NSLocalNetworkUsageDescription: Panoramica connects to your Mac for routes during testing.
        ScenicAPIBaseURL: $(SCENIC_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikkodime.panoramica
        SCENIC_API_BASE_URL: http://localhost:8787
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ScenicRouteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ScenicRoute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nikkodime.panoramica.uitests
schemes:
  ScenicRoute:
    build:
      targets:
        ScenicRoute: all
    test:
      targets: [ScenicRouteUITests]
